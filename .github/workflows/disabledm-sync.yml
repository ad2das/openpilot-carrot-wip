name: Maintain DisableDM fork

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disabledm-upstream-sync
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'ad2das/openpilot-carrot-wip' && github.ref == 'refs/heads/carrot-wip'
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.compare.outputs.needed }}
    steps:
      - name: Compare upstream before downloading the repository
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ahead=$(gh api "repos/$REPOSITORY/compare/carrot-wip...ajouatom:carrot-wip" --jq .ahead_by)
          if [ "$ahead" -gt 0 ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream already included; no commit or push." >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the patched fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: carrot-wip
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Prepare upstream merge without publishing
        run: python tools/disabledm_sync/sync.py prepare --state "$RUNNER_TEMP/disabledm-sync.json"

      - name: Install focused test dependencies
        run: python -m pip install pytest aiohttp

      - name: Check DisableDM and sync regressions
        run: |
          python -m pytest --noconftest --override-ini=addopts= -p no:cacheprovider -q -rs \
            tools/disabledm_sync/test_sync.py \
            openpilot/selfdrive/monitoring/test_disable_dm_config.py \
            openpilot/selfdrive/monitoring/test_config_params.py \
            openpilot/selfdrive/monitoring/test_dm2_context.py \
            openpilot/selfdrive/selfdrived/tests/test_camera_config.py \
            openpilot/selfdrive/carrot/server/tests/test_intro_monitoring.py \
            openpilot/selfdrive/carrot/server/tests/test_vision_dm_config.py \
            openpilot/selfdrive/carrot/server/tests/test_youtube_live_contract.py \
            openpilot/selfdrive/carrot/server/tests/test_settings_schema.py \
            openpilot/selfdrive/carrot/server/tests/test_telemetry_origin.py \
            openpilot/selfdrive/carrot/server/tests/test_upload_identity.py \
            tools/docs/wiki_settings/tests

      - name: Check video and hidden settings in the web client
        working-directory: openpilot/selfdrive/carrot/web
        run: |
          node --test tests/dm_settings.test.mjs tests/vision_session_policy.test.mjs tests/vision_session_controller.test.mjs tests/vision_recovery_integration.test.mjs tests/settings_search_only.test.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Reject unexpected build changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Publish validated merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python tools/disabledm_sync/sync.py publish --state "$RUNNER_TEMP/disabledm-sync.json"

      - name: Report result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "## DisableDM fork update: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/disabledm-sync.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/disabledm-sync.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Conflicts, failed checks or a concurrent branch update stop publication. Native Params tests may be skipped when params_pyx is not built; these are not vehicle validation.' >> "$GITHUB_STEP_SUMMARY"
