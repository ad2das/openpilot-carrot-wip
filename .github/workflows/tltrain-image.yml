name: tltrain-image

# Builds the public GPU training image for the RunPod "trainpod" driver:
# python 3.11 + torch cu126 + the carrot-tl-vision training pins. Environment
# only, so the image is safe to publish: no datasets, no repo code, no keys.

on:
  # workflow_dispatch only registers once this file is on the default branch
  # (carrot-wip). Until then, pushing to the tltrain-image branch triggers a build.
  push:
    branches:
      - tltrain-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tltrain

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout workflow branch (build context)
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/tltrain/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### tltrain image"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- image: \`${{ env.IMAGE }}:latest\`, \`${{ env.IMAGE }}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
