name: opsim-image

# Builds a public CPU-only openpilot test image for the RunPod "opsim-pod" driver.
# The image is self-contained (system deps + uv venv + a built carrot-wip checkout)
# so a fresh pod can `git fetch <ref> && scons` incrementally instead of a cold build.
# Public repo code + public packages only: no datasets, keys, logs or private paths.

on:
  # workflow_dispatch only registers once this file is on the default branch
  # (carrot-wip). Until then, pushing to the opsim-image branch triggers a build.
  push:
    branches:
      - opsim-image
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref of ad2das/openpilot-carrot-wip to bake into the image
        required: false
        default: carrot-wip
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opsim

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The build context (this workflow + tools/opsim/Dockerfile) always comes
      # from the branch that defines the workflow. The carrot-wip tree is cloned
      # *inside* the image via the OPENPILOT_REF build arg.
      - name: Checkout workflow branch (build context)
        uses: actions/checkout@v7
      - name: Resolve ref to bake
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
            echo "ref=${REF:-carrot-wip}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=carrot-wip" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve the ref's commit sha (for the image tag)
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/${{ steps.ref.outputs.ref }} | cut -f1)"
          [ -n "$SHA" ] || SHA="$(git ls-remote https://github.com/${{ github.repository }}.git ${{ steps.ref.outputs.ref }} | cut -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "resolved ${{ steps.ref.outputs.ref }} -> $SHA"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/opsim/Dockerfile
          push: true
          build-args: |
            OPENPILOT_REF=${{ steps.ref.outputs.ref }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Mirror to public ttl.sh (24h)
        continue-on-error: true
        run: |
          # GHCR user packages default to private and GITHUB_TOKEN cannot change
          # visibility, so also publish an anonymous, pullable copy for RunPod.
          # ttl.sh images are public and expire after the tag's TTL (24h max).
          docker pull "${{ env.IMAGE }}:latest"
          docker tag "${{ env.IMAGE }}:latest" "ttl.sh/ad2das-opsim:24h"
          docker push "ttl.sh/ad2das-opsim:24h"
          docker buildx imagetools inspect "ttl.sh/ad2das-opsim:24h" || true
      - name: Try to make the package public
        continue-on-error: true
        run: |
          # Best-effort: flip the GHCR package visibility to public so pods can
          # pull anonymously. GITHUB_TOKEN usually lacks admin:packages, so this
          # may 403 and require a one-time manual console click.
          curl -sS -o /dev/null -w "%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/opsim" \
            -d '{"visibility":"public"}' || true
      - name: Summary
        run: |
          {
            echo "### opsim image"
            echo "- ref: \`${{ steps.ref.outputs.ref }}\`"
            echo "- commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- image: \`${{ env.IMAGE }}:latest\`, \`${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}\`"
            echo "- public mirror: \`ttl.sh/ad2das-opsim:24h\` (private GHCR fallback)"
          } >> "$GITHUB_STEP_SUMMARY"
